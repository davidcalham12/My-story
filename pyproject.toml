[project]
name = "novaforge"
version = "2.0.0"
description = "A multi-agent harness that writes novels under a bounded context"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# There is NO Anthropic SDK here. Claude Code is the orchestrator and the only
# access to a model is the user's own session; an API client would be a second
# route to the model, which is exactly what this architecture no longer has.
#
# The embedder is optional: the whole suite runs without it, against a recorded
# stream, at no cost.
vector = ["sqlite-vec>=0.1.6", "sentence-transformers>=3.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
