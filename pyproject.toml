[project]
name = "novaforge"
version = "2.0.0"
description = "A multi-agent harness that writes novels under a bounded context"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The real engine and the embedder are optional on purpose: the whole test
# suite runs without them, on the mock, at no cost.
real = ["anthropic>=0.40"]
vector = ["sqlite-vec>=0.1.6", "sentence-transformers>=3.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
