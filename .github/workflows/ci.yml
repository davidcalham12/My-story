name: CI

# Everything here runs on the mock engine and costs nothing. A suite that needs
# a credential does not run in CI, and a suite that does not run in CI is
# documentation.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi uvicorn pydantic pyyaml pytest httpx sqlite-vec
      - name: Tests
        env:
          USE_RECORDED_STREAM: 'true'
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  instruments:
    # LOOP-003's two instruments ship with --self-test and neither ran in CI.
    # A check that exists and never runs is documentation, and these are the
    # ones that decide whether a feedback sheet may be sent at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The sheet validator behaves
        run: node specs/loops/LOOP-003/validate-sheet.mjs --self-test
      - name: The measurement instrument reproduces the committed run
        run: node specs/loops/LOOP-003/measure.mjs --self-test
