\* The sweep checks the process before marking, and still runs only at start-up.
\* Expected: every safety property holds; OrphansEventuallyHalted fails
\* (an orphan created while both servers stay up is never swept).
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2}
  Runs = {r1, r2}
  None = None
  GUARD = TRUE
  RESWEEP = FALSE
INVARIANTS
  TypeOK
  NoLiveRunMarkedHalted
  HaltedIsFinished
PROPERTIES
  StartLeavesNoOrphan
  OrphansEventuallyHalted
