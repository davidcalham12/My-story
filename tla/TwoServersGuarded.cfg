\* The fix: the sweep checks the process before marking, and because that
\* makes it safe to run at any time, a running server may re-run it.
\* Expected: every safety property and the liveness property hold.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2}
  Runs = {r1, r2}
  None = None
  GUARD = TRUE
  RESWEEP = TRUE
INVARIANTS
  TypeOK
  NoLiveRunMarkedHalted
  HaltedIsFinished
PROPERTIES
  StartLeavesNoOrphan
  OrphansEventuallyHalted
